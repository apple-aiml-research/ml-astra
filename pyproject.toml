[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astra_tool_sandbox"
version = "3.1.0"
description = "A controllable, stateful and interactive sandbox for agent evaluation with benchmarking"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [
    { name = "Zidi Xiu", email = "z_xiu@apple.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "attrs>=21.3.0",  # imported directly (common/, roles/); >=21.3.0 for the `attrs` namespace. Was only arriving transitively via jsonschema
    "ccy==1.3.1",  # pinned: validate_currency_code relies on ccy.currency() returning None (not raising KeyError) for unknown codes; changed within the 1.x line
    "decorator>=5.1.1",
    "dill>=0.3.8",
    "httpx>=0.27.0,<0.28",  # <0.28 load-bearing for the anthropic SDK (passes the `proxies` kwarg httpx 0.28 removed)
    "langchain>=1.3.9",
    "networkx==3.2.1",
    "numpy>=1.26.2",  # numpy 2.x supported (scipy 1.13.1)
    "openai>=2.0,<3.0",  # 1.17->2.x major bump (validated 2.54); <3.0 load-bearing: openai 3.x switches to httpx2
    "phonenumbers>=8.13.39",
    "polars==1.34.0",  # scoring-path: PINNED for grading reproducibility (migrated 0.20->1.x: strict=False drops, Enum str categories, map_rows Float64, with_row_index). 1.34.0 = latest 1.x supporting py3.9 (1.37+ require py>=3.10)
    "pydantic>=2.7.4",
    "pyyaml>=6.0.1",
    "rapidfuzz==3.9.3",
    "requests>=2.32.3",
    "rouge-score==0.1.2",
    "scipy==1.13.1",  # linear_sum_assignment in common/evaluation.py (core import); 1.13.x supports numpy 2.x
    "StrEnum>=0.4.15",
    "typing_extensions>=4.12.2",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
agent-all = [
  "anthropic>=0.26,<0.40",
  "vertexai>=1.49,<2.0",
  "tenacity>=8.4,<9",
]
# Needed only by `astra_tool_sandbox/gymnasium_env.py`, the `gymnasium.Env`
# adapter. Nothing else in the package may import `gymnasium`, so the core
# install and every other extra stay free of it.
gymnasium = [
  # No lower bound: the adapter only uses `gymnasium.Env`, `spaces.Text` and the
  # 5-tuple `step()`, all long-standing API. Verified against 0.29.1 and 1.3.0.
  # `<2.0` guards against a future breaking major.
  "gymnasium<2.0",
]
dev = [
    "genbadge[all]",
    "google-auth-stubs",
    "mypy",
    "pre-commit",
    "pyarrow==16.1.0", # < for converting polars to pandas dataframes
    "pydantic-extra-types",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "seaborn==0.13.2",
    "types-decorator",
    "types-networkx",
    "types-requests",
    "types-tornado",
    "types-tqdm",
    "types-PyYAML",
    "python-dotenv",
    "inflect"
]

[project.scripts]
astra_tool_sandbox = "astra_tool_sandbox.cli:main"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (unusesd import) in all `__init__.py` files, and in `path/to/file.py`.
"__init__.py" = ["F401"]

[tool.setuptools.packages.find]
exclude = ["data*"]
include = ["astra_tool_sandbox*"]

[tool.setuptools.package-data]
astra_tool_sandbox = [
  "roles/*.yaml",  # hermes_prompts.yaml — loaded by the roles registry on the CLI run path
  "scenarios/astra_v1/**/*.yaml",
  "scenarios/astra_v1/**/ctx_data/*.json",
  "scenarios/astra_v1/**/scenarios_jsons/*.json",
  "scenarios/astra_v1/**/challenging_scenarios_jsons/*.json",
  "scenarios/astra_v1/**/converted_TAG_scenarios/milestone_tags.json",  # milestone_tagger only rewrites it when stale
]

# Configure pytest to parallelize test execution. This configuration is used e.g.
# - by VSCode's built-in testing extension
# - when running `pytest .` on the command line
[tool.pytest.ini_options]
addopts="-n auto"

[tool.mypy]
# Pin the mypy target Python version so strict checks are deterministic
# regardless of the interpreter mypy runs under. Modern mypy only supports
# targets >= 3.10, so we target 3.11 (the project still runs on 3.9-3.12).
python_version = "3.11"
# The options below are what `--strict` encompasses.
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
implicit_reexport = false
strict_equality = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = "(?x)(^experiments/)"
